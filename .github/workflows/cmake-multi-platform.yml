name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
    paths-ignore: ['**.md', 'docs/**', 'docs-site/**', 'LICENSE']
  pull_request:
    branches: [ "main" ]
    paths-ignore: ['**.md', 'docs/**', 'docs-site/**', 'LICENSE']
  # Weekly cache warmer: GitHub evicts caches unused for 7 days, and caches
  # saved on PR branches are invisible to sibling branches. Running on main
  # every week keeps a main-scoped LLVM cache warm for all PR branches.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

# Collapse redundant runs on the same ref, but only auto-cancel PR runs:
# cancelling an in-progress main/scheduled run mid-LLVM-build would prevent
# the shared cache from ever being saved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Cloning and building only; no write scopes needed anywhere.
permissions:
  contents: read

jobs:
  # Build (or verify) the LLVM install cache ONCE per OS. Without this job,
  # a fully cold cache would be built independently by every compiler leg on
  # the same OS (gcc + clang on ubuntu), with only one cache save winning
  # (issue #10). The compiler matrix below depends on this job and only
  # restores the cache.
  llvm:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Keep this OS list in sync with the build matrix below: any OS added
      # there (e.g. re-enabling macos-latest) MUST be added here too, or its
      # compiler legs will fail at the read-only cache restore + verify step.
      matrix:
        os: [ubuntu-latest, windows-latest]
        llvm-branch: ['release/20.x']
    steps:
    - uses: actions/checkout@v4   # provides llvm-build-config.txt for the cache key
      with:
        persist-credentials: false

    - name: Cache LLVM build
      id: cache-llvm-build
      uses: actions/cache@v5
      with:
        path: llvm-install
        # llvm-build-config.txt fingerprints the LLVM configure flags. The
        # restore-keys prefix falls back to any cache for this OS/branch
        # (including ones saved before the fingerprint file existed).
        key: ${{ runner.os }}-llvm-${{ matrix.llvm-branch }}-${{ hashFiles('llvm-build-config.txt') }}
        restore-keys: |
          ${{ runner.os }}-llvm-${{ matrix.llvm-branch }}-

    # cache-hit is only true on an exact primary-key match; a restore-keys
    # (prefix) restore still reports false. Gate the expensive build on
    # whether a usable install tree is actually present.
    - name: Check for restored LLVM install
      id: llvm-installed
      shell: bash
      run: |
        if { [ -x llvm-install/bin/mlir-tblgen ] || [ -x llvm-install/bin/mlir-tblgen.exe ]; } && \
           { [ -x llvm-install/bin/clang ] || [ -x llvm-install/bin/clang.exe ]; }; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Clone LLVM
      if: steps.llvm-installed.outputs.present != 'true'
      run: |
        git clone https://github.com/llvm/llvm-project.git --branch ${{ matrix.llvm-branch }} --depth 1

    - name: Build LLVM (Unix/macOS)
      if: steps.llvm-installed.outputs.present != 'true' && (runner.os == 'Linux' || runner.os == 'macOS')
      run: |
        mkdir -p llvm-build
        cd llvm-build
        cmake ../llvm-project/llvm \
          -DLLVM_ENABLE_PROJECTS="mlir;clang" \
          -DLLVM_TARGETS_TO_BUILD="host" \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_ENABLE_ASSERTIONS=ON \
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/llvm-install"
        cmake --build . --target install -j$(nproc)

    - name: Build LLVM (Windows)
      if: steps.llvm-installed.outputs.present != 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        mkdir llvm-build
        cd llvm-build
        cmake ..\llvm-project\llvm `
          -DLLVM_ENABLE_PROJECTS="mlir;clang" `
          -DLLVM_TARGETS_TO_BUILD="host" `
          -DCMAKE_BUILD_TYPE=Release `
          -DLLVM_ENABLE_ASSERTIONS=ON `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/llvm-install"
        cmake --build . --target install --config Release -j $env:NUMBER_OF_PROCESSORS

  build:
    needs: llvm
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 4 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      # 4. <MacOS, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
#       os: [ubuntu-latest, windows-latest, macos-latest]
        os: [ubuntu-latest, windows-latest]
        llvm-branch: ['release/20.x']
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
#         - os: macos-latest
#           c_compiler: clang
#           cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
#         - os: macos-latest
#           c_compiler: gcc
#         - os: macos-latest
#           c_compiler: cl

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    # Cache system packages on Linux
    - name: Cache apt packages
      if: matrix.os == 'ubuntu-latest'
      uses: actions/cache@v5
      with:
        path: /var/cache/apt
        key: ${{ runner.os }}-apt-${{ hashFiles('**/workflow-apt-packages.txt') }}
        restore-keys: |
          ${{ runner.os }}-apt-
        
    # Cache vcpkg on Windows
    - name: Cache vcpkg
      if: matrix.os == 'windows-latest'
      uses: actions/cache@v5
      with:
        path: |
          vcpkg
          ${{ github.workspace }}/vcpkg_installed
        key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json', '**/vcpkgConfiguration.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ gcc libx11-dev libgl1-mesa-dev libglu1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
        sudo apt-get install -y libpng-dev libglfw3 libglfw3-dev
        sudo apt-get install -y libjpeg-dev libfreetype6-dev
        sudo apt-get install -y freeglut3-dev
    
    - name: Setup VCPKG (Windows)
      if: matrix.os == 'windows-latest' && steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        if (!(Test-Path -Path "vcpkg")) {
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg integrate install
        }
      shell: pwsh

    - name: Setup matplot++ (Linux)
      if: matrix.os == 'ubuntu-latest' && steps.cache-matplotpp.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/alandefreitas/matplotplusplus.git
        cd matplotplusplus
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DMATPLOTPP_BUILD_EXAMPLES=OFF -DMATPLOTPP_BUILD_TESTS=OFF
        cmake --build . --parallel $(nproc)
        sudo cmake --install .
        
    - name: Setup matplot++ (Windows)
      if: matrix.os == 'windows-latest' && steps.cache-matplotpp.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/alandefreitas/matplotplusplus.git
        cd matplotplusplus
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DMATPLOTPP_BUILD_EXAMPLES=OFF -DMATPLOTPP_BUILD_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
        cmake --build . --config Release
        cmake --install . --config Release
      shell: pwsh

    # The llvm job (a `needs` dependency) has already built and saved the
    # LLVM cache for this OS, so a read-only restore is guaranteed to
    # succeed; the verify step below fails fast if it somehow didn't.
    - name: Restore LLVM build cache
      id: cache-llvm-build
      uses: actions/cache/restore@v5
      with:
        path: llvm-install
        key: ${{ runner.os }}-llvm-${{ matrix.llvm-branch }}-${{ hashFiles('llvm-build-config.txt') }}
        restore-keys: |
          ${{ runner.os }}-llvm-${{ matrix.llvm-branch }}-

    - name: Verify LLVM install
      shell: bash
      run: |
        if { [ -x llvm-install/bin/mlir-tblgen ] || [ -x llvm-install/bin/mlir-tblgen.exe ]; } && \
           { [ -x llvm-install/bin/clang ] || [ -x llvm-install/bin/clang.exe ]; }; then
          echo "LLVM install restored from cache."
        else
          echo "::error::LLVM install tree not restored from cache; the llvm job should have built and saved it. Re-run the workflow."
          exit 1
        fi

    - name: Setup environment
      run: echo "${{ github.workspace }}/llvm-install/bin" >> $GITHUB_PATH

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DDOMAINFLOW_BUILD_TESTS=ON
        -DDOMAINFLOW_MLIR_TOOLS=ON
        -DLLVM_DIR=${{ github.workspace }}/llvm-install/lib/cmake/llvm
        -DMLIR_DIR=${{ github.workspace }}/llvm-install/lib/cmake/mlir
        -S ${{ github.workspace }}

    - name: Build test targets
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Build custom targets
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --target dfa-import-tosa

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}
